<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> E-Learning Web App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div id="auth-section" class="container mt-5">
    <div class="card p-4 shadow-sm mx-auto" style="max-width: 400px;">
      <h3 class="text-center mb-3" id="auth-title">Login</h3>

      <div id="login-form">
        <input id="login-username" type="text" class="form-control mb-2" placeholder="Username" required>
        <input id="login-password" type="password" class="form-control mb-3" placeholder="Password" required>
        <button class="btn btn-primary w-100 mb-2" onclick="login()">Login</button>
        <p class="text-center">Don’t have an account? 
          <a href="#" onclick="toggleAuth('signup')">Sign up</a>
        </p>
      </div>

      <div id="signup-form" class="d-none">
        <input id="signup-username" type="text" class="form-control mb-2" placeholder="Username" required>
        <input id="signup-password" type="password" class="form-control mb-3" placeholder="Password" required>
        <button class="btn btn-success w-100 mb-2" onclick="signup()">Sign Up</button>
        <p class="text-center">Already have an account? 
          <a href="#" onclick="toggleAuth('login')">Login</a>
        </p>
      </div>
    </div>
  </div>

  <div id="dashboard" class="d-none">
    <nav class="navbar navbar-dark bg-primary px-3">
      <span class="navbar-brand">E-Learning Web App</span>
      <span id="welcome-user" class="text-white"></span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </nav>

    <div class="container my-4">
      <h2>Available Courses</h2>
      <div class="progress my-3" style="height: 25px;">
        <div id="progress-bar" class="progress-bar" style="width: 0%">0%</div>
      </div>
      <div id="course-list" class="d-flex flex-wrap gap-3"></div>
    </div>
  </div>

  <script>
   
    const courses = [
      { id: 1, name: "HTML & CSS Basics" },
      { id: 2, name: "JavaScript Fundamentals" },
      { id: 3, name: "Python for Beginners" }
    ];

    function toggleAuth(type) {
      if (type === 'signup') {
        document.getElementById('login-form').classList.add('d-none');
        document.getElementById('signup-form').classList.remove('d-none');
        document.getElementById('auth-title').innerText = 'Sign Up';
      } else {
        document.getElementById('signup-form').classList.add('d-none');
        document.getElementById('login-form').classList.remove('d-none');
        document.getElementById('auth-title').innerText = 'Login';
      }
    }

    function signup() {
      const username = document.getElementById('signup-username').value;
      const password = document.getElementById('signup-password').value;

      if (!username || !password) return alert('Please fill all fields.');

      localStorage.setItem('user_' + username, JSON.stringify({ username, password, completed: [] }));
      alert('Signup successful! Please login.');
      toggleAuth('login');
    }

    function login() {
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;
      const userData = localStorage.getItem('user_' + username);

      if (!userData) return alert('User not found. Please sign up.');
      const user = JSON.parse(userData);

      if (user.password !== password) return alert('Incorrect password.');

      localStorage.setItem('currentUser', username);
      loadDashboard();
    }

    function loadDashboard() {
      document.getElementById('auth-section').classList.add('d-none');
      document.getElementById('dashboard').classList.remove('d-none');

      const username = localStorage.getItem('currentUser');
      document.getElementById('welcome-user').innerText = `Welcome, ${username}`;
      renderCourses();
    }

    function renderCourses() {
      const username = localStorage.getItem('currentUser');
      const user = JSON.parse(localStorage.getItem('user_' + username));
      const courseList = document.getElementById('course-list');
      courseList.innerHTML = '';

      courses.forEach(course => {
        const completed = user.completed.includes(course.id);
        const btnClass = completed ? 'btn-success' : 'btn-outline-primary';
        const btnText = completed ? 'Completed' : 'Mark as Completed';

        const card = document.createElement('div');
        card.className = 'card p-3 shadow-sm';
        card.style.width = '250px';
        card.innerHTML = `
          <h5>${course.name}</h5>
          <button class="btn ${btnClass} mt-2" onclick="toggleComplete(${course.id})">${btnText}</button>
        `;
        courseList.appendChild(card);
      });

      updateProgress();
    }

    function toggleComplete(courseId) {
      const username = localStorage.getItem('currentUser');
      const user = JSON.parse(localStorage.getItem('user_' + username));

      if (user.completed.includes(courseId)) {
        user.completed = user.completed.filter(id => id !== courseId);
      } else {
        user.completed.push(courseId);
      }

      localStorage.setItem('user_' + username, JSON.stringify(user));
      renderCourses();
    }

    function updateProgress() {
      const username = localStorage.getItem('currentUser');
      const user = JSON.parse(localStorage.getItem('user_' + username));
      const percent = Math.round((user.completed.length / courses.length) * 100);
      const progressBar = document.getElementById('progress-bar');
      progressBar.style.width = percent + '%';
      progressBar.innerText = percent + '%';
    }

    function logout() {
      localStorage.removeItem('currentUser');
      document.getElementById('dashboard').classList.add('d-none');
      document.getElementById('auth-section').classList.remove('d-none');
      document.getElementById('login-username').value = '';
      document.getElementById('login-password').value = '';
    }

    // Auto-login if user already active
    if (localStorage.getItem('currentUser')) {
      loadDashboard();
    }
  </script>
</body>
</html>
